[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm[simple]>=8",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
# Corporis, an independent fork of Anny (NAVER LABS Europe). The distribution is "corporis"; it
# installs the "anny" package (the body model, kept close to upstream) and the "corporis" package.
name = "corporis"
dynamic = ["version"]
authors = [
    # author of Anny, the upstream body model
    { name = "Romain Brégier", email = "romain.bregier@naverlabs.com" }
]
maintainers = [
    # maintainer of the Corporis fork; its additions are written by AI coding agents (see README)
    { name = "infinia-yzl" }
]
description="Humanoid 3D characters built on the Anny body model, with a web viewer and glTF export."
readme = "README.md"
license-files = ["LICENSE", "LICENSE_THINGS", "NOTICE"]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "roma>=1.5.7",
    "numpy",
    "pyyaml",
    "pillow",
    "requests",
    "safetensors",
    "trimesh",
    "warp-lang"
]

[project.urls]
Homepage = "https://github.com/infinia-yzl/anny"
Upstream = "https://github.com/naver/anny"

[project.scripts]
corporis = "corporis.cli:main"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"anny" = ["data/*"]

[project.optional-dependencies]
examples = [
    "gradio",
    "jsonargparse",
    "matplotlib>=3.10.9",
    "ipykernel",
    "notebook",
    "scipy",
    "jupytext",
    "py-soma-x==0.1.0"  # keep in sync with anny.models.soma.SOMA_ASSETS_REVISION
]
smpl = [
    "smplx",
    "chumpy"
]
# the viewer build (python -m anny.viewer build) and the authoring tools of the poses,
# the correctives and the hair; the page itself also needs node 22 or later
viewer = [
    "scipy",
    "tetgen",
    "embreex"
]
# the calibration and the photo benchmark of anny's faces (python -m anny.faces.authoring.*)
faces = [
    "scipy",
    "mediapipe",
    "pyarrow",
    "matplotlib",
    "playwright",
]
# the pose from a picture (corporis pose, corporis.pose_from_image) and the flat drawings
pose = [
    "mediapipe",
    "contourpy",
]
dev = [
    "ruff==0.14.5",
    "build",
    "twine"
]
cu126 = ["torch"]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[tool.uv.sources]
torch = { index = "torch-cu126", extra = "cu126" }

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
# Formatter target: `ruff format` wraps code to 88 columns.
line-length = 88

[tool.ruff.lint]
# "E" and "W" are pycodestyle (PEP8, incl. W291/W293 trailing whitespace),
# "F" is pyflakes (ruff's default set).
select = ["E", "W", "F"]

[tool.ruff.lint.pycodestyle]
# E501 only fires past 120, above the formatter's 88. The formatter already keeps code
# within 88; what it cannot wrap is prose and long string literals, so linting at 88
# would just flag those. 120 catches the genuinely unreadable ones instead.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# Public API surface: names are re-exported, not used locally.
"src/anny/__init__.py" = ["F401", "F403"]
# jupytext py:percent tutorials: imports belong to the cell that introduces them.
"tutorials/*.py" = ["E402"]