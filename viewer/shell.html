<title>Anny Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* the viewer is a dark studio: the figure stands in front of a dark backdrop, so the interface keeps dark tones in
     both colour schemes */
  :root, :root[data-theme="light"], :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0c0d10;
    --panel: rgba(18, 19, 23, 0.82);
    --panel-solid: #16171b;
    --raised: rgba(236, 231, 225, 0.05);
    --raised-2: rgba(236, 231, 225, 0.09);
    --line: rgba(236, 231, 225, 0.11);
    --line-2: rgba(236, 231, 225, 0.2);
    --text: #ece7e1;
    --muted: #a39b93;
    --faint: #6f6962;
    --accent: #c9a46a;
    --accent-2: #e2c48f;
    --accent-soft: rgba(201, 164, 106, 0.16);
    --accent-line: rgba(201, 164, 106, 0.55);
    --good: #7fae84;
    --bad: #e0a08c;
    --sans: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r-s: 8px; --r-m: 12px; --r-l: 16px;
    --top-h: 56px; --rail-w: 74px; --insp-w: 340px; --gap: 8px;
    --inset-l: 0px; --inset-r: 0px;
    --hit: 36px;
    --blur: blur(18px);
  }
  @media (pointer: coarse) { :root { --hit: 44px; } }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font: 14px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; background: var(--ground); }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  #c:active { cursor: grabbing; }
  .ico { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  /* the interface fades in once the model is ready, and stays away in the still pictures of the tests (?shot) */
  .topbar, .rail, .insp, .viewbar, .hrail, .stats, .coach { opacity: 0; transition: opacity 0.5s ease; }
  body.ready .topbar, body.ready .rail, body.ready .insp, body.ready .viewbar, body.ready .hrail, body.ready .stats, body.ready .coach { opacity: 1; }
  body.shot .topbar, body.shot .rail, body.shot .insp, body.shot .viewbar, body.shot .hrail, body.shot .stats, body.shot .coach, body.shot .toasts, body.shot .menu { display: none !important; }
  .glass { background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  /* ------------------------------------------------------------ tooltips */
  [data-tip] { position: relative; }
  [data-tip]:not([aria-expanded="true"]):hover::after, [data-tip]:not([aria-expanded="true"]):focus-visible::after {
    content: attr(data-tip); position: absolute; z-index: 60; pointer-events: none; white-space: pre;
    font: 500 11.5px/1 var(--sans); letter-spacing: 0.01em; color: var(--text);
    background: #0a0a0c; border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); animation: tip-in 0.12s ease 0.35s both;
  }
  [data-tip-pos="down"]:hover::after, [data-tip-pos="down"]:focus-visible::after { top: calc(100% + 8px); left: 50%; translate: -50% 0; }
  [data-tip-pos="up"]:hover::after, [data-tip-pos="up"]:focus-visible::after { bottom: calc(100% + 8px); left: 50%; translate: -50% 0; }
  [data-tip-pos="right"]:hover::after, [data-tip-pos="right"]:focus-visible::after { left: calc(100% + 10px); top: 50%; translate: 0 -50%; }
  [data-tip-pos="left"]:hover::after, [data-tip-pos="left"]:focus-visible::after { right: calc(100% + 10px); top: 50%; translate: 0 -50%; }
  @keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
  @media (hover: none) { [data-tip]::after { display: none !important; } }
  /* the name of the bone under the pointer, while the skeleton shows */
  .bone-tip {
    position: fixed; z-index: 55; pointer-events: none; translate: 12px -150%; white-space: nowrap;
    font: 500 11.5px/1 var(--mono); color: var(--text);
    background: #0a0a0c; border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  }
  body.shot .bone-tip { display: none !important; }
  /* the legend of the weight view, at the top of the view */
  .wlegend {
    position: fixed; z-index: 30; top: 60px; left: 50%; translate: -50% 0; width: min(340px, calc(100vw - 32px));
    padding: 7px 11px; border-radius: 11px; font-size: 12px; line-height: 1.35; color: var(--text);
  }
  .wlegend p { margin: 3px 0 0; color: var(--muted); }
  .wlegend .wl-head { display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .wlegend .wl-name { font: 600 12.5px/1.2 var(--mono); }
  .wlegend .wl-kept { flex: 1; font-size: 11.5px; color: var(--muted); }
  .wlegend .tb { height: 24px; padding: 0 8px; font-size: 12px; }
  .wl-bar { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .wl-ramp { flex: 1; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #141f80 0%, #00bfff 25%, #1ad933 50%, #ffe61a 75%, #f2261a 100%); }
  body.shot .wlegend { display: none !important; }

  /* ------------------------------------------------------------ buttons */
  .ib {
    min-width: var(--hit); height: var(--hit); display: inline-grid; place-items: center; padding: 0 8px; box-sizing: border-box;
    border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  }
  .ib:hover:not(:disabled) { color: var(--text); background: var(--raised-2); }
  .ib:disabled { opacity: 0.35; cursor: default; }
  .ib[aria-pressed="true"], .ib[aria-expanded="true"] { color: var(--text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  :is(button, input, summary, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tb {
    display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 12px;
    font: 500 12.5px/1 var(--sans); color: var(--text); background: var(--raised); cursor: pointer;
    border: 1px solid var(--line); border-radius: 9px;
  }
  .tb:hover:not(:disabled) { background: var(--raised-2); border-color: var(--line-2); }
  .tb:disabled { opacity: 0.5; cursor: default; }
  .tb .ico { width: 15px; height: 15px; }
  .tb-quiet { background: transparent; border-color: transparent; color: var(--muted); padding: 0 8px; }
  .tb-quiet:hover:not(:disabled) { color: var(--text); background: var(--raised); border-color: transparent; }
  .sep { width: 1px; align-self: stretch; margin: 8px 3px; background: var(--line); flex: none; }

  /* ------------------------------------------------------------ top bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); box-sizing: border-box; z-index: 20;
    display: flex; align-items: center; gap: 12px; padding: 0 12px 0 18px;
    padding-top: env(safe-area-inset-top, 0px);
    background: linear-gradient(180deg, rgba(10, 11, 13, 0.85), rgba(10, 11, 13, 0));
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .brand { display: flex; align-items: baseline; gap: 6px; user-select: none; }
  .brand-mark { font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1; letter-spacing: -0.01em; }
  .brand-name { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .identity {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; margin-left: 6px; max-width: 42vw;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); cursor: pointer;
    font-size: 12.5px; white-space: nowrap; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  .identity span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .identity:hover { border-color: var(--line-2); }
  .identity-dot { width: 16px; height: 16px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); }
  .actions {
    margin-left: auto; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 13px;
    background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  .actions .sep { margin: 6px 3px; }
  .phone-only { display: none !important; }
  .menu {
    position: fixed; z-index: 70; min-width: 200px; padding: 5px; display: grid; gap: 1px;
    background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    animation: pop-in 0.14s ease both;
  }
  .menu button { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; text-align: left; font-size: 13px; }
  .menu button:hover, .menu button:focus-visible { background: var(--raised-2); outline: none; }
  .menu .ico { color: var(--muted); }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ------------------------------------------------------------ rails */
  .rail {
    position: fixed; top: calc(var(--top-h) + var(--gap)); width: var(--rail-w); box-sizing: border-box; z-index: 12;
    padding: 8px 6px; border-radius: var(--r-l);
    background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  .rail-left { left: var(--gap); }
  .rail-right { right: var(--gap); }
  .rail-list { display: flex; flex-direction: column; gap: 4px; }
  .rail-tab {
    display: grid; justify-items: center; gap: 4px; padding: 9px 2px 8px; border: 0; border-radius: 11px; cursor: pointer;
    background: transparent; color: var(--muted); transition: color 0.15s ease, background-color 0.15s ease;
  }
  .rail-tab:hover { color: var(--text); background: var(--raised); }
  .rail-tab[aria-selected="true"] { color: var(--text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .rail-tab[aria-selected="true"] .ico { color: var(--accent-2); }
  .rail-label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.01em; line-height: 1.1; text-align: center; }

  /* ------------------------------------------------------------ inspectors */
  .insp {
    position: fixed; top: calc(var(--top-h) + var(--gap)); bottom: var(--gap); width: var(--insp-w); max-width: calc(100vw - 2 * var(--rail-w) - 5 * var(--gap));
    box-sizing: border-box; z-index: 11; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-l);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .insp-left { left: calc(var(--gap) * 2 + var(--rail-w)); }
  .insp-right { right: calc(var(--gap) * 2 + var(--rail-w)); }
  .insp.entering { opacity: 0; transform: translateX(-8px); }
  .insp-right.entering { transform: translateX(8px); }
  .insp-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 0 18px 22px; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .insp-x { position: absolute; top: 10px; right: 10px; z-index: 3; }
  .sheet-handle { display: none; }
  .sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
  .sec > * { min-width: 0; }
  .sec-head {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 58px; margin: 0 -18px; padding: 0 56px 0 18px;
    background: linear-gradient(180deg, var(--panel-solid) 70%, rgba(22, 23, 27, 0)); border-radius: var(--r-l) var(--r-l) 0 0;
  }
  .sec-head h2 { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 26px; line-height: 1; }
  .sec-note { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sec-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .sec-lead { margin: -6px 0 2px; font-size: 12.5px; color: var(--muted); text-wrap: pretty; }
  .sub { margin: 10px 0 -2px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .sub-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sub-val { font-size: 12px; color: var(--muted); }
  .note { margin: 0; font-size: 12px; color: var(--muted); text-wrap: pretty; }
  .note.empty { text-align: center; padding: 12px 0; }
  .inline-msg { margin: 0; font-size: 12px; color: var(--muted); }
  .inline-msg:empty { display: none; }
  .inline-msg[data-kind="error"] { color: var(--bad); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-label { font-size: 13px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-text {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 120px;
    font: 12px/1.45 var(--mono); color: var(--text); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }

  /* cards of the characters */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card {
    display: flex; align-items: center; gap: 10px; padding: 10px; min-height: 58px; text-align: left; cursor: pointer;
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-m); transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .card:hover { border-color: var(--line-2); background: var(--raised-2); }
  .card[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
  .avatar { position: relative; width: 34px; height: 34px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--b) 0 42%, var(--a) 42%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
  .avatar::after { content: ""; position: absolute; width: 8px; height: 8px; right: 6px; top: 15px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.5); }
  .card-text { display: grid; gap: 2px; min-width: 0; }
  .card-name { font-size: 13px; font-weight: 500; }
  .card-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 12.5px/1 var(--sans); color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; display: inline-flex; align-items: center; gap: 8px;
  }
  .chip:hover { color: var(--text); border-color: var(--line-2); }
  .chip[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); border-color: var(--accent-line); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); }

  /* segmented controls */
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); }
  .seg button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 0 11px;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font: 500 12.5px/1 var(--sans); white-space: nowrap;
  }
  .seg button:hover { color: var(--text); background: var(--raised); }
  .seg button[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .seg-fill { display: flex; }
  .seg-fill button { flex: 1; }
  .seg-icons button { padding: 0 9px 0 7px; gap: 5px; }
  .seg-icons .ico { width: 17px; height: 17px; }

  /* switches */
  .switch { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 12.5px; border-radius: 8px; }
  .switch:hover { color: var(--text); }
  .switch-track { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--raised-2); box-shadow: inset 0 0 0 1px var(--line-2); transition: background-color 0.15s ease; }
  .switch-knob { position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform 0.15s ease, background-color 0.15s ease; }
  .switch[aria-checked="true"] { color: var(--text); }
  .switch[aria-checked="true"] .switch-track { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(12px); background: var(--accent-2); }
  .switches { display: grid; gap: 4px; justify-items: start; }
  .switch-row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: -4px 0 0 -6px; }
  .seg-fill button { min-width: 0; padding: 0 6px; }

  /* search */
  .search { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 36px; border-radius: 10px; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); color: var(--muted); }
  .search:focus-within { border-color: var(--accent-line); }
  .search-input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: 13px var(--sans); outline: none; }
  .search-input::-webkit-search-cancel-button { filter: invert(0.7); }

  /* folding groups */
  .folds { display: grid; gap: 2px; }
  .fold { border-radius: 10px; }
  .fold[open] { background: rgba(0, 0, 0, 0.14); }
  .fold summary {
    display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 8px; cursor: pointer; list-style: none;
    font-size: 13px; border-radius: 10px;
  }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary:hover { background: var(--raised); }
  .fold summary .ico { color: var(--muted); transition: transform 0.15s ease; }
  .fold[open] summary .ico:first-child { transform: rotate(90deg); }
  .fold-title { flex: 1; }
  .fold-n { font-size: 11.5px; color: var(--muted); }
  .fold[data-changed] .fold-n { color: var(--accent-2); }
  .fold-reset { display: none; width: 26px; height: 26px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
  .fold[data-changed] .fold-reset { display: grid; }
  .fold-reset:hover { color: var(--text); background: var(--raised-2); }
  .fold-body { display: grid; gap: 12px; padding: 4px 10px 14px; }
  .fold-body.chips { display: flex; gap: 6px; }

  /* sliders */
  .sliders { display: grid; gap: 14px; }
  .sl { display: grid; gap: 4px; }
  .sl-head { display: flex; align-items: center; gap: 6px; min-height: 26px; }
  .sl-head label { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sl-read { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sl-reset { width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; visibility: hidden; }
  .sl[data-changed] .sl-reset { visibility: visible; }
  .sl-reset:hover { color: var(--text); background: var(--raised-2); }
  .sl-num {
    width: 52px; height: 24px; box-sizing: border-box; padding: 0 6px; text-align: right;
    font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    background: transparent; border: 1px solid transparent; border-radius: 6px;
  }
  .sl-num:hover { border-color: var(--line); }
  .sl-num:focus { color: var(--text); background: rgba(0, 0, 0, 0.35); border-color: var(--accent-line); outline: none; }
  .sl[data-changed] .sl-num { color: var(--text); }
  .sl-track { position: relative; }
  .sl-def { position: absolute; top: 5px; width: 2px; height: 12px; margin-left: -1px; border-radius: 1px; background: rgba(236, 231, 225, 0.4); pointer-events: none; }
  .sl-custom .sl-def { display: none; }
  .sl-bubble {
    position: absolute; bottom: calc(100% + 4px); translate: -50% 0; padding: 3px 6px; border-radius: 6px; pointer-events: none;
    font: 500 11px var(--mono); color: var(--ground); background: var(--accent-2); opacity: 0; transition: opacity 0.12s ease; white-space: nowrap;
  }
  .sl.dragging .sl-bubble { opacity: 1; }
  .sl-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
  .sl-compact { padding: 10px 12px; border-radius: 10px; background: var(--raised); }
  input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 6px;
    background: var(--track, linear-gradient(90deg, var(--line-2) 0 var(--lo, 0%), var(--accent) var(--lo, 0%) var(--hi, 0%), var(--line-2) var(--hi, 0%)));
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
  }
  input[type="range"]::-moz-range-track {
    height: 6px; border-radius: 6px;
